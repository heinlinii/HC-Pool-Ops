{% extends "base.html" %}
{% block content %}

<section class="section-head">
  <h1>File Field Note?</h1>
  <p>Jarvis is about to file this field update. Fix anything wrong, then approve it.</p>
</section>

<section class="card">
  <form method="post" action="/crew-home/file" class="stack">

    <label>Category</label>
    <select name="category">
      {% set categories = [
        "General Note",
        "Work Done",
        "Work To Look At",
        "Material Needed",
        "Problem Found",
        "Equipment Note",
        "Photo Note"
      ] %}
      {% for cat in categories %}
        <option value="{{ cat }}" {% if preview.category == cat %}selected{% endif %}>{{ cat }}</option>
      {% endfor %}
    </select>

    <label>Priority</label>
    <select name="priority">
      {% set priorities = ["Normal", "High", "Urgent"] %}
      {% for p in priorities %}
        <option value="{{ p }}" {% if preview.priority == p %}selected{% endif %}>{{ p }}</option>
      {% endfor %}
    </select>

    <label>Title</label>
    <input name="title" value="{{ preview.title or '' }}" required>

    <label>Body</label>
    <textarea name="body" rows="8" required>{{ preview.body or raw_message }}</textarea>

    <div class="inline-form">
      <div>
        <label>Client</label>
        <input name="client" value="{{ client or '' }}" placeholder="Client">
      </div>

      <div>
        <label>Property / Job</label>
        <input name="property" value="{{ property or '' }}" placeholder="Property / job">
      </div>

      <div>
        <label>Due Date</label>
        <input name="due_date" type="date" value="{{ due_date or '' }}">
      </div>
    </div>

    <div class="inline-form" style="margin-top:16px;">
      <button class="btn primary" type="submit">File It</button>
      <a class="btn" href="/crew-home">Cancel</a>
    </div>
  </form>
</section>

<section class="card">
  <h2>Original Message</h2>
  <p style="white-space:pre-wrap;">{{ raw_message }}</p>
</section>

{% endblock %}

{% extends "base.html" %}
{% block content %}

<section class="section-head">
  <h1>Jarvis Filing Preview</h1>
  <p>I’m about to file this into Invisible Office. Fix anything wrong, then approve it.</p>
</section>

<section class="card">
  <h2>Review This</h2>

  <form method="post" action="/jarvis/file" class="stack">
    <label>Category</label>
    <select name="category">
      {% set categories = [
  "General Note",
  "Reminder",
  "Work Done",
  "Work To Look At",
  "Client Follow-Up",
  "Material Needed",
  "Billing Note",
  "Schedule Task",
  "Problem Found",
  "Equipment Note"
] %}
      {% for cat in categories %}
        <option value="{{ cat }}" {% if preview.category == cat %}selected{% endif %}>{{ cat }}</option>
      {% endfor %}
    </select>

    <label>Priority</label>
    <select name="priority">
      {% set priorities = ["Normal", "High", "Urgent"] %}
      {% for p in priorities %}
        <option value="{{ p }}" {% if preview.priority == p %}selected{% endif %}>{{ p }}</option>
      {% endfor %}
    </select>

    <label>Title</label>
    <input name="title" value="{{ preview.title or '' }}" required>

    <label>Body</label>
    <textarea name="body" rows="8" required>{{ preview.body or raw_message }}</textarea>

    <div class="inline-form">
      <div>
        <label>Client</label>
        <input name="client" value="{{ client or '' }}" placeholder="Client">
      </div>

      <div>
        <label>Property / Job</label>
        <input name="property" value="{{ property or '' }}" placeholder="Property / job">
      </div>

      <div>
        <label>Due Date</label>
        <input name="due_date" type="date" value="{{ due_date or '' }}">
      </div>
    </div>

    <div class="inline-form" style="margin-top:16px;">
      <button class="btn primary" type="submit">Approve and File It</button>
      <a class="btn" href="/jarvis">Cancel</a>
    </div>
  </form>
</section>

<section class="card">
  <h2>Original Message</h2>
  <p style="white-space:pre-wrap;">{{ raw_message }}</p>
</section>

{% endblock %}
